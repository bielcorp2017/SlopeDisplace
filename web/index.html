<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>대산당진 3공구 천의2터널 옹벽 변위 분석결과</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel2: #1d222c;
    --border: #2a3140;
    --text: #e6e8eb;
    --text-dim: #98a0ad;
    --accent: #4ea1ff;
    --ok: #4ade80;
    --warn: #facc15;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 100vh;
    height: 100vh; width: 100vw; overflow: hidden;
  }
  .left {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .left header {
    padding: 10px 12px 8px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  }
  .left header h1 {
    font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .2px;
    line-height: 1.30; flex: 1 1 100%; color: #f1f3f6;
  }
  .left header select {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px;
    flex: 1 1 auto; min-width: 0;
  }
  .filelist { overflow: auto; flex: 1; }
  table.files { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.files th, table.files td {
    padding: 8px 10px; font-size: 12px; text-align: left;
    border-bottom: 1px solid var(--border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 컬럼 폭 — 상태 칼럼을 살짝 키움 */
  table.files th:nth-child(1), table.files td:nth-child(1) { width: auto; }
  table.files th:nth-child(2), table.files td:nth-child(2) { width: 56px; }
  table.files th:nth-child(3), table.files td:nth-child(3) { width: 110px; }
  table.files th:nth-child(4), table.files td:nth-child(4) { width: 64px; }
  table.files th { color: var(--text-dim); font-weight: 500; background: var(--panel2); position: sticky; top: 0; }
  table.files tr.row { cursor: pointer; }
  table.files tr.row:hover { background: #1b2230; }
  table.files tr.row.selected { background: #223149; }
  table.files tr.row.ref td:first-child::before {
    content: "★ "; color: var(--warn); margin-right: 2px;
  }
  .status { font-size: 11px; color: var(--text-dim); }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  button.pre {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--accent); color: var(--accent); background: transparent;
    cursor: pointer; white-space: nowrap;
  }
  button.pre:hover { background: rgba(78,161,255,.12); }
  button.pre:disabled { opacity: .5; cursor: default; }
  .joblog {
    padding: 10px 14px; border-top: 1px solid var(--border); font-size: 11px;
    color: var(--text-dim); max-height: 160px; overflow: auto; background: var(--panel2);
  }
  .joblog .line { font-family: ui-monospace, monospace; padding: 1px 0; }
  .joblog .line .ts { color: #5b6577; margin-right: 6px; }
  .joblog .line.err { color: var(--err); }
  .joblog .line.ok { color: var(--ok); }

  /* Right side - viewer */
  .right { position: relative; min-width: 0; min-height: 0; }
  #canvas { position: absolute; inset: 0; display: block; }
  .topbar {
    position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
    gap: 10px; align-items: center; pointer-events: none;
  }
  .panel {
    background: rgba(22,26,34,.92); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; pointer-events: auto;
    backdrop-filter: blur(6px);
  }
  .modes { display: flex; gap: 4px; }
  .modes button {
    background: var(--panel2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px;
    cursor: pointer; font-size: 12px;
  }
  .modes button.active { color: var(--text); border-color: var(--accent); background: rgba(78,161,255,.15); }
  .clamp { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .clamp input[type=range] { width: 140px; accent-color: var(--accent); }
  .clamp .val { font-family: ui-monospace, monospace; min-width: 64px; text-align: right; }
  .pointsize { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .pointsize input[type=range] { width: 80px; accent-color: var(--accent); }

  .legend {
    position: absolute; right: 12px; bottom: 12px;
    background: rgba(22,26,34,.92); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; font-size: 11px;
    pointer-events: auto; min-width: 180px;
  }
  .legend .title { color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .legend .bar { height: 14px; border-radius: 3px; margin-bottom: 4px; }
  .legend .ticks { display: flex; justify-content: space-between; font-family: ui-monospace, monospace; }

  .stats {
    position: absolute; left: 12px; bottom: 12px;
    background: rgba(22,26,34,.92); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; font-size: 11px;
    pointer-events: auto; min-width: 220px;
  }
  .stats .title { color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .stats table { border-collapse: collapse; }
  .stats td { padding: 1px 8px 1px 0; font-family: ui-monospace, monospace; }
  .stats td.k { color: var(--text-dim); }

  .empty { color: var(--text-dim); padding: 20px; text-align: center; font-size: 12px; }

  /* Tilt analysis panel (right-docked, collapsible) */
  .tilt-toggle {
    background: var(--panel2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px;
    cursor: pointer; font-size: 12px;
  }
  .tilt-toggle.active { color: var(--text); border-color: var(--accent); background: rgba(78,161,255,.15); }
  .tilt-panel {
    position: absolute; top: 56px; right: 12px; width: 440px;
    background: rgba(22,26,34,.95); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; pointer-events: auto;
    backdrop-filter: blur(6px); display: none;
    max-height: calc(100vh - 80px); overflow: auto;
  }
  .tilt-panel.open { display: block; }
  .tilt-panel h3 {
    margin: 0 0 8px 0; font-size: 12px; color: var(--text-dim);
    font-weight: 500; text-transform: uppercase; letter-spacing: .5px;
  }
  .tilt-panel .empty-msg { color: var(--text-dim); font-size: 12px; padding: 10px 0; }
  .tilt-card {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .tilt-card .pair {
    font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
  }
  .tilt-card .pair b { color: var(--text); font-weight: 600; }
  .tilt-headline {
    font-size: 22px; font-family: ui-monospace, monospace;
    font-weight: 700; margin: 6px 0 2px 0;
  }
  .tilt-headline.outward { color: var(--err); }
  .tilt-headline.inward  { color: var(--accent); }
  .tilt-headline.nochange { color: var(--text-dim); }
  .tilt-ci {
    font-size: 11px; color: var(--text-dim); font-family: ui-monospace, monospace;
  }
  .tilt-verdict {
    margin-top: 6px; padding: 4px 6px; border-radius: 3px; font-size: 11px;
    text-align: center;
  }
  .tilt-verdict.sig { background: rgba(248,113,113,.15); color: var(--err); border: 1px solid rgba(248,113,113,.4); }
  .tilt-verdict.nosig { background: rgba(74,222,128,.12); color: var(--ok); border: 1px solid rgba(74,222,128,.4); }
  .tilt-metrics {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 11px;
    font-family: ui-monospace, monospace; margin-top: 8px;
  }
  .tilt-metrics .k { color: var(--text-dim); }
  .tilt-chart-wrap { background: var(--panel2); border: 1px solid var(--border);
    border-radius: 5px; padding: 8px; height: 240px; }
  .tilt-actions { display: flex; gap: 6px; margin-top: 8px; }
  .tilt-actions button {
    flex: 1; font-size: 11px; padding: 5px 8px; border-radius: 4px; cursor: pointer;
    background: var(--panel2); color: var(--text-dim); border: 1px solid var(--border);
  }
  .tilt-actions button:hover { color: var(--text); border-color: var(--accent); }
  .tilt-warn {
    background: rgba(248,113,113,.15); color: var(--err);
    border: 1px solid rgba(248,113,113,.4); border-radius: 5px;
    padding: 8px 10px; margin-bottom: 10px; font-size: 11px; line-height: 1.5;
  }
  .tilt-warn b { color: #ffc1c1; }
  .tilt-3d {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
    padding: 8px 10px; margin-top: 8px; font-size: 11px;
  }
  .tilt-3d-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .tilt-3d-row label { color: var(--text-dim); min-width: 60px; }
  .tilt-3d-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .tilt-3d-row .val { font-family: ui-monospace, monospace; min-width: 56px; text-align: right; }
  .tilt-3d-row .swatch {
    display: inline-block; width: 12px; height: 3px; vertical-align: middle;
  }
  .tilt-3d-legend { display: flex; gap: 12px; font-size: 10px; color: var(--text-dim); margin-top: 4px; }

  .spinner {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid rgba(78,161,255,.3); border-top-color: var(--accent);
    animation: spin .8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<aside class="left">
  <header>
    <h1>대산당진 3공구 천의2터널<br>옹벽 변위 분석결과</h1>
    <select id="dataset"></select>
    <button id="refresh" title="파일 목록 새로고침" style="margin-left:4px;padding:2px 8px;cursor:pointer;">↻</button>
  </header>
  <div class="filelist">
    <table class="files">
      <thead><tr><th>파일</th><th>크기</th><th>상태</th><th></th></tr></thead>
      <tbody id="files"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">데이터 없음</div>
  </div>
  <div class="joblog" id="joblog"></div>
</aside>

<main class="right">
  <canvas id="canvas"></canvas>
  <div class="topbar">
    <div class="panel modes" id="modes">
      <button data-mode="signed_normal" title="기준 표면 법선 방향 부호 변위 (옹벽 변위 모니터링 권장)">법선 (signed)</button>
      <button data-mode="magnitude" title="대상 점과 기준 점군 최근접점 간 유클리드 거리 (부호 없음)">최소거리</button>
      <button data-mode="horizontal" class="active" title="수평면(XY) 변위 / 법선의 XY방향 부호 투영">수평</button>
      <button data-mode="vertical" title="수직(Z) 변위">수직</button>
      <button data-mode="rgb" title="원본 스캔 RGB 색상">원본</button>
    </div>
    <div class="panel clamp">
      <span>±</span>
      <input type="range" id="clamp" min="0.005" max="0.5" step="0.005" value="0.005" />
      <span class="val" id="clamp-val">±0.005 m</span>
    </div>
    <div class="panel pointsize">
      <span>점</span>
      <input type="range" id="psize" min="0.5" max="6" step="0.1" value="3.2" />
    </div>
    <div class="panel" style="margin-left:auto">
      <button id="cam-reset" class="tilt-toggle" title="카메라를 초기 자동-fit 위치로 복귀">🏠 초기 시점</button>
    </div>
    <div class="panel">
      <button id="tilt-toggle" class="tilt-toggle" title="옹벽 기울기 변화 분석 패널 열기/닫기">📐 기울기</button>
    </div>
  </div>

  <div id="tilt-panel" class="tilt-panel">
    <h3>옹벽 기울기 변화 분석</h3>
    <div id="tilt-body"><div class="empty-msg">변위 데이터가 있는 스캔을 선택하세요.</div></div>
  </div>
  <div class="legend" id="legend">
    <div class="title" id="legend-title">법선 변위 (m)</div>
    <div class="bar" id="legend-bar"></div>
    <div class="ticks" id="legend-ticks"><span>-0.050</span><span>0</span><span>+0.050</span></div>
  </div>
  <div class="point-tooltip" id="point-tooltip" style="display:none;position:absolute;pointer-events:none;background:rgba(0,0,0,.85);color:#eee;padding:6px 10px;border-radius:4px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:10;border:1px solid rgba(255,255,255,.15);"></div>
  <div class="stats" id="stats" style="display:none">
    <div class="title">통계</div>
    <table id="stats-tbl"></table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
